name: Build OS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm grub-pc-bin grub-common xorriso qemu-system-x86 gcc-i686-linux-gnu

      - name: Build kernel
        working-directory: ./kernel
        run: make

      - name: Test boot (headless)
        working-directory: ./kernel
        run: |
          timeout 10 qemu-system-i386 -cdrom os.iso -nographic -serial stdio -no-reboot || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-iso
          path: kernel/os.iso
          retention-days: 7